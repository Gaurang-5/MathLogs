<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon-192x192.png" />

  <!-- PWA Meta Tags -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />

  <!-- Primary Meta Tags -->
  <title>MathLogs | Modern Coaching Management & AI Grading Software</title>
  <meta name="title" content="MathLogs | Modern Coaching Management & AI Grading Software" />
  <meta name="description"
    content="Manage your coaching center efficiently with MathLogs. Automate WhatsApp alerts, use instant AI test scanning, track fees, and handle student onboarding seamlessly." />
  <meta name="keywords"
    content="coaching management software, attendance tracking, test grading, OCR grading, WhatsApp alerts for parents, fee collection, tuition center software" />
  <meta name="author" content="MathLogs" />

  <link rel="canonical" href="https://mathlogs.app/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mathlogs.app/" />
  <meta property="og:title" content="MathLogs | Modern Coaching Management & AI Grading Software" />
  <meta property="og:description"
    content="Manage your coaching center efficiently with MathLogs. Automate WhatsApp alerts, use instant AI test scanning, track fees, and handle student onboarding." />
  <meta property="og:image" content="https://mathlogs.app/icon-512x512.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://mathlogs.app/" />
  <meta property="twitter:title" content="MathLogs | Modern Coaching Management & AI Grading Software" />
  <meta property="twitter:description"
    content="Manage your coaching center efficiently with MathLogs. Automate WhatsApp alerts, use instant AI test scanning, track fees, and handle student onboarding." />
  <meta property="twitter:image" content="https://mathlogs.app/icon-512x512.png" />

  <meta name="theme-color" content="#ffffff" />

  <!-- iOS PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MathLogs" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Android PWA Support -->
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" />
  </noscript>

  <!-- Preload hero images for faster LCP -->
  <link rel="preload" as="image" href="/images/features/dashboard-mobile.png" media="(max-width: 767px)"
    fetchpriority="high">
  <link rel="preload" as="image" href="/dashboard.png" media="(min-width: 768px)" fetchpriority="high">

</head>

<body>
  <div id="root">
    <style>
      body {
        margin: 0;
        background-color: white;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        overflow-x: hidden;
      }

      .app-skeleton {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .sk-nav {
        height: 64px;
        border-bottom: 1px solid #f3f4f6;
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .sk-logo {
        font-size: 1.25rem;
        font-weight: bold;
        color: #111827;
      }

      .sk-hero {
        display: flex;
        flex-direction: column;
        max-width: 1280px;
        margin: 0 auto;
        padding: 60px 24px 0;
        width: 100%;
        box-sizing: border-box;
      }

      .sk-title {
        max-width: 600px;
        font-size: 3rem;
        font-weight: 800;
        color: #111827;
        line-height: 1.1;
        margin-bottom: 24px;
      }

      .sk-p {
        max-width: 480px;
        height: 16px;
        background: #f3f4f6;
        border-radius: 8px;
        margin-bottom: 12px;
      }

      .sk-btn {
        width: 160px;
        height: 50px;
        background: #111827;
        border-radius: 9999px;
        margin-top: 24px;
      }

      .sk-image-wrap {
        margin-top: 40px;
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .sk-image-wrap img {
        width: 110%;
        max-width: 900px;
        height: auto;
        border-radius: 24px;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.1);
      }

      @media (min-width: 1024px) {
        .sk-hero {
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
          padding-top: 100px;
        }

        .sk-left {
          width: 50%;
          z-index: 10;
          padding-right: 40px;
          box-sizing: border-box;
        }

        .sk-title {
          font-size: 5rem;
        }

        .sk-image-wrap {
          width: 50%;
          margin-top: 0;
          justify-content: flex-end;
          perspective: 2000px;
        }

        .sk-image-wrap img {
          width: 150%;
          max-width: 1200px;
          transform: rotateY(-2deg) translateX(-10%);
          transform-origin: center right;
        }
      }
    </style>
    <div class="app-skeleton">
      <div class="sk-nav">
        <div class="sk-logo">MathLogs</div>
        <div class="sk-btn" style="width: 100px; height: 40px; border-radius: 12px; background: #f3f4f6;"></div>
      </div>
      <div class="sk-hero">
        <div class="sk-left">
          <div class="sk-title">Everything you need for modern coaching.</div>
          <div class="sk-p"></div>
          <div class="sk-p" style="width: 80%;"></div>
          <div class="sk-btn"></div>
        </div>
        <div class="sk-image-wrap">
          <picture>
            <source media="(min-width: 1024px)" srcset="/dashboard.png" />
            <img src="/images/features/dashboard-mobile.png" alt="MathLogs Dashboard" fetchpriority="high" />
          </picture>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
