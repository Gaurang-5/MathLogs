<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon-192x192.png" />

  <!-- PWA Meta Tags -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />

  <!-- Primary Meta Tags -->
  <title>MathLogs | Modern Coaching Management & AI Grading Software</title>
  <meta name="title" content="MathLogs | Modern Coaching Management & AI Grading Software" />
  <meta name="description"
    content="Manage your coaching center efficiently with MathLogs. Automate WhatsApp alerts, use instant AI test scanning, track fees, and handle student onboarding seamlessly." />
  <meta name="keywords"
    content="coaching management software, attendance tracking, test grading, OCR grading, WhatsApp alerts for parents, fee collection, tuition center software" />
  <meta name="author" content="MathLogs" />

  <link rel="canonical" href="https://mathlogs.app/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mathlogs.app/" />
  <meta property="og:title" content="MathLogs | Modern Coaching Management & AI Grading Software" />
  <meta property="og:description"
    content="Manage your coaching center efficiently with MathLogs. Automate WhatsApp alerts, use instant AI test scanning, track fees, and handle student onboarding." />
  <meta property="og:image" content="https://mathlogs.app/icon-512x512.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://mathlogs.app/" />
  <meta property="twitter:title" content="MathLogs | Modern Coaching Management & AI Grading Software" />
  <meta property="twitter:description"
    content="Manage your coaching center efficiently with MathLogs. Automate WhatsApp alerts, use instant AI test scanning, track fees, and handle student onboarding." />
  <meta property="twitter:image" content="https://mathlogs.app/icon-512x512.png" />

  <meta name="theme-color" content="#ffffff" />

  <!-- iOS PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MathLogs" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Android PWA Support -->
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" />
  </noscript>

  <!-- Preload hero images for faster LCP -->
  <link rel="preload" as="image" href="/images/features/dashboard-mobile.png" media="(max-width: 767px)"
    fetchpriority="high">
  <link rel="preload" as="image" href="/dashboard.png" media="(min-width: 768px)" fetchpriority="high">

</head>

<body>
  <div id="root">
    <!-- App Shell for instantaneous LCP -->
    <style>
      body {
        margin: 0;
        background: white;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }

      .app-shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        padding-top: 15vh;
        opacity: 0;
        animation: fadein 0.3s forwards 0.2s;
      }

      @keyframes fadein {
        to {
          opacity: 1;
        }
      }

      .app-shell h1 {
        font-size: 2.5rem;
        letter-spacing: -0.05em;
        color: #111827;
        margin: 0;
      }

      .app-shell .hero {
        width: 90vw;
        max-width: 1000px;
        margin-top: 3rem;
        transform: translateY(20px);
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.18);
        border-radius: 24px;
      }

      @media(min-width: 768px) {
        .app-shell h1 {
          font-size: 4rem;
        }
      }
    </style>
    <div class="app-shell">
      <h1>MathLogs</h1>
      <picture>
        <source media="(min-width: 768px)" srcset="/dashboard.png" />
        <img src="/images/features/dashboard-mobile.png" class="hero" fetchpriority="high"
          alt="MathLogs App Shell Hero" />
      </picture>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
